name: Castle static smoke checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate castle pages and scripts
        run: node tests/castle-smoke.cjs
