name: Castle browser gameplay smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser-smoke:
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium, iphone-webkit, tablet-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start local website
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/castle-server.log 2>&1 &
      - name: Wait for local website
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/academy-royal-3d.html > /dev/null; then
              echo 'Castle test website is ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/castle-server.log
          exit 1
      - name: Run ${{ matrix.project }} gameplay tests
        run: |
          mkdir -p test-results
          npx playwright test tests/phase6-great-hall-3d.spec.cjs tests/phase8-discovery-rooms-3d.spec.cjs tests/phase7-perspective.spec.cjs tests/phase7-observatory-3d.spec.cjs tests/phase7-house-rooms-3d.spec.cjs tests/phase6-2-courtyard-3d.spec.cjs tests/castle-browser.spec.cjs tests/castle-journey.spec.cjs tests/phase5-heart-diagnostics.spec.cjs --project=${{ matrix.project }} --workers=1 --max-failures=1 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/castle-results.json
          PLAYWRIGHT_HTML_OPEN: never
      - name: Print failed test diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import json, pathlib
          path=pathlib.Path('test-results/castle-results.json')
          if not path.exists():
              print('JSON test results were not generated')
          else:
              data=json.loads(path.read_text())
              def walk(suites):
                  for suite in suites:
                      for spec in suite.get('specs',[]):
                          for test in spec.get('tests',[]):
                              if test.get('status') not in ('unexpected','flaky'):
                                  continue
                              print('FAILED:',test.get('projectName'),spec.get('title'))
                              for result in test.get('results',[]):
                                  for error in result.get('errors',[]):
                                      print((error.get('message') or str(error))[:3500])
                      walk(suite.get('suites',[]))
              walk(data.get('suites',[]))
          PY
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castle-playwright-report-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
            /tmp/castle-server.log
          if-no-files-found: ignore
