name: Castle browser gameplay smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start local website
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/castle-server.log 2>&1 &
      - name: Wait for local website
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/academy-royal-3d.html > /dev/null; then
              echo 'Castle test website is ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/castle-server.log
          exit 1
      - name: Run desktop, Android, iPhone and tablet gameplay tests
        run: npx playwright test tests/castle-browser.spec.cjs --workers=1
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: castle-playwright-report
          path: |
            test-results/
            playwright-report/
            /tmp/castle-server.log
          if-no-files-found: ignore
