name: Castle browser gameplay smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local website
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/castle-server.log 2>&1 &
      - name: Run desktop and mobile smoke tests
        run: npx playwright test tests/castle-browser.spec.cjs --project=chromium --workers=1
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: castle-playwright-report
          path: test-results/
          if-no-files-found: ignore
